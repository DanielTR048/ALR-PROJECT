<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Clientes | ALR Soluções em Engenharia, Segurança e Medicina do Trabalho</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { background: #070d08; color: #f0f8f0; overflow: hidden; }
    #alr-scroll { height: 100vh; overflow-y: auto; overflow-x: hidden; scroll-behavior: smooth; }
    #alr-scroll::-webkit-scrollbar { width: 5px; }
    #alr-scroll::-webkit-scrollbar-track { background: #070d08; }
    #alr-scroll::-webkit-scrollbar-thumb { background: #1e6b35; border-radius: 3px; }
    button { font-family: inherit; }
    input, textarea, select { font-family: inherit; background: transparent; }
    input::placeholder, textarea::placeholder { color: #3a5a3a; }
    select option { background: #0f2314; color: #c8dcc8; }
    h1,h2,h3,h4 { text-wrap: balance; }
    p { text-wrap: pretty; }
    .page-enter { animation: fadeUp 0.35s ease both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>

<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
